<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exercício 4 Trabalho 8">
    <link rel="stylesheet" href="./styles.css">
    <title>Exercício 4</title>
</head>

<body>

    <main>

        <h1>Cadastro de Usuário</h1>

        <form enctype="multipart/form-data" name="cadastro" action="login.php" method="post">
            <div>
                <label for="usuario">Usuario: </label>
                <input type="text" id="usuario" name="usuario">
                <span></span>
            </div>
            <div>
                <label for="senha">Senha: </label>
                <input type="password" id="senha" name="senha">
                <span></span>
            </div>
            <div>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email">
                <span></span>
            </div>
            <button>Cadastrar</button>
        </form>
    </main>

    <script>
        function validaForm(e) {
            let form = e.target;
            let formValido = true;

            const spanUsuario = form.usuario.nextElementSibling;
            const spanSenha = form.senha.nextElementSibling;
            const spanEmail = form.email.nextElementSibling;

            spanUsuario.textContent = "";;
            spanSenha.textContent = "";
            spanEmail.textContent = "";

            if (form.usuario.value === "") {
                spanUsuario.textContent = "Usuário deve ser preenchido";
                formValido = false;
            }
            if (form.senha.value === "") {
                spanSenha.textContent = "A senha deve ser preenchida";
                formValido = false;
            }
            if (form.email.value === "") {
                spanEmail.textContent = "O email deve ser preenchido";
                formValido = false;
            }

            if (!formValido) {
                e.preventDefault();
            }
        }

        document.forms.cadastro.onsubmit = validaForm;
    </script>
</body>

</html>
